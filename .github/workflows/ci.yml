name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # JOB 1: Automated Quality & Unit Tests
  # ============================================================================
  test:
    name: Lint & Unit Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: development
      LOG_LEVEL: INFO
      SECRET_KEY: ci-environment-test-secret-key-min-32-chars
      ADMIN_API_KEY: ci-test-admin-api-key-safe-value
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/realestate_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      PGBOUNCER_MODE: "false"
      LLM_PROVIDER: stub
      OPENROUTER_API_KEY: dummy-test-openrouter-key
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Run Ruff critical syntax & import check
        run: uv run ruff check src tests --select E9,F821,F822,F823,E722

      - name: Run isolated unit test suite
        run: uv run pytest tests/unit -v --tb=short

  # ============================================================================
  # JOB 2: Build & Push Docker Image to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3: Automated SSH Deployment to DigitalOcean Droplet
  # ============================================================================
  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/realestate_ai || e  xit 1

            echo "📥 1. Pulling latest code and con  figs..."
            git fetch origin main
            git reset --hard origin/main

            echo "🚫 2. Excluding dashboard from server..."
            rm -rf dashboard/

            echo "🔐 3. Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 4. Pulling updated prebuilt image..."
            docker compose -f docker/docker-compose.prod.yml pull api_1 api_2 api_3 worker

            echo "🔄 5. Running database migrations..."
            docker compose -f docker/docker-compose.prod.yml exec -T api_1 alembic upgrade head

            echo "🚀 6. Gracefully reloading containers..."
            docker compose -f docker/docker-compose.prod.yml up -d --no-build --remove-orphans

            echo "🩺 7. Verifying API health..."
            sleep 10
            curl --fail http://localhost/health || exit 1

            echo "🧹 8. Pruning unused images..."
            docker image prune -f
            echo "🎉 Deployment completed successfully!"
