user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # PDF & Knowledge Document upload limit
    client_max_body_size 50M;

    # Gzip compression for static assets & JSON (SSE streams are excluded)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Connection upgrade mapping for WebSockets / Socket.IO
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # Upstream Cluster: 3 FastAPI Replicas (Round Robin)
    # --------------------------------------------------------------------------
    upstream fastapi_cluster {
        # Round Robin distribution with failure detection
        server api_1:8000 max_fails=3 fail_timeout=10s;
        server api_2:8000 max_fails=3 fail_timeout=10s;
        server api_3:8000 max_fails=3 fail_timeout=10s;

        # Keepalive connections to backend instances to reduce TCP handshake overhead
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ----------------------------------------------------------------------
        # Nginx Local Health Endpoint
        # ----------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # SSE Streaming Endpoints (LLM Visitor & Chat Streams)
        # ----------------------------------------------------------------------
        location ~* /(api/v1/chat/.*/stream|api/v1/widget/.*/stream) {
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;

            # CRITICAL: Disable buffering for instant token-by-token streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Extended timeouts for long-running LLM generation
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Transparent failover if a replica is down
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ----------------------------------------------------------------------
        # Socket.IO & Native WebSocket Gateway (/api/v1/chat/ws/)
        # ----------------------------------------------------------------------
        location ~* ^/(socket\.io/|api/v1/chat/ws/) {
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts for persistent socket connections
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        
                # ----------------------------------------------------------------------
        # Public Embeddable Chat Widget (widget.js)
        # ----------------------------------------------------------------------
        location ~* ^/(widget\.js|widget\.js\.map)$ {
            root /var/www/widget;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin * always;
            try_files $uri =404;
        }
        
        
        
        
        
        # ----------------------------------------------------------------------
        # General API, Dashboard & REST Routes
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # Standard API timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Automatic retry on next healthy replica if one fails
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}