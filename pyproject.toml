[project]
name = "realestate-ai"
version = "0.1.0"
description = "Multi-tenant AI assistant platform for real estate agencies"
readme = "README.md"
authors = [
    { name = "Munawar Jamil", email = "munawar.minhas777@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.35.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "python-socketio>=5.17.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]
[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "S311"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests as integration tests (requiring external services/keys)",
]
